[develop]
script_dir=$base/lib/perception_pkg
[install]
install_scripts=$base/lib/perception_pkg

[flake8]
max-line-length = 99
# tools/tabela_kalibre.py dunya uretecini worlds/ altindan import
# edebilmek icin sys.path'i import'lardan once duzenliyor.
per-file-ignores =
    tools/tabela_kalibre.py:E402
