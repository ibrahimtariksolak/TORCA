name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# En az ayricalik: is akisi yalnizca kodu okur, hicbir sey yazmaz.
permissions:
  contents: read

jobs:
  lint-ve-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          # Birim testlerin ihtiyac duydugu minimum paketler.
          # Tam ROS 2 kurmak CI icin pahali; testler yalnizca saf Python
          # modulleri (ipm, generate_otoban) uzerinde calisiyor.
          pip install numpy opencv-python-headless pytest flake8

      - name: Flake8
        run: |
          python -m flake8 --max-line-length 99 \
            --per-file-ignores='src/perception_pkg/tools/tabela_kalibre.py:E402,src/perception_pkg/tools/engel_testi.py:E402' \
            src/perception_pkg/perception_pkg/ \
            src/perception_pkg/launch/ \
            src/perception_pkg/tools/ \
            src/perception_pkg/worlds/*.py

      - name: Birim testleri
        working-directory: src/perception_pkg
        run: |
          # perception_pkg modulunu dogrudan import edebilmek icin
          PYTHONPATH=. python -m pytest test/test_ipm.py \
                                       test/test_dunya_geometri.py -v

      - name: Sir / kimlik bilgisi taramasi
        run: |
          # Deterministik tarama. CI dosyasinin kendisi yoksayiliyor,
          # cunku taramanin kendisi dosyada gectigi icin yanlis pozitif
          # tetikliyor.
          bulgu=$(git grep -nIiE \
            "api[_-]?key|secret|passwd|password=|private[_-]?key|BEGIN RSA|BEGIN OPENSSH|ghp_|github_pat_|AKIA[0-9A-Z]{16}" \
            -- . ':!.github/workflows/ci.yml' || true)
          if [ -n "$bulgu" ]; then
            echo "::error::Olasi sir bulundu:"
            echo "$bulgu"
            exit 1
          fi
